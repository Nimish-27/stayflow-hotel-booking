spring:
  application:
    name: hotel-booking
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema, Hibernate never changes it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC      # created_at / cancelled_at are stored in UTC
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/sample-data}
  mvc:
    format:
      date: iso               # LocalDate request params use yyyy-MM-dd

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  booking:
    max-nights: 30
    window-days: 365
    inventory-seed-days: 372       # window + 7-day safety buffer
    alternative-shift-days: 7
    max-alternatives: 3
    free-cancellation-hours: 48